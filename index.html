<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Century 21 Nova · Plataforma de Gestión</title>
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<meta name="description" content="Acceso a la plataforma de gestión de Century 21 Nova">
<script>(function(){try{var t=localStorage.getItem('c21-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .login-screen::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(900px 540px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 540px at 100% 10%, var(--bg-glow-2), transparent 60%);
  }
  .login-foot{text-align:center;margin-top:18px;font-size:.76rem;color:var(--text-3)}
  .demo-note{
    margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);font-size:.74rem;color:var(--text-3);line-height:1.5;
  }
  .api-error{color:var(--danger);font-size:.82rem;margin-top:10px;display:none}
  .api-ok{color:var(--success,#2e7d32);font-size:.84rem;margin-top:10px;display:none;line-height:1.5}
</style>
</head>
<body>

<div class="top-fixed-toggle">
  <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="login-screen">
  <div class="login-card">
    <div class="login-banner"><img src="assets/img/nova_fondo.png" alt="Century 21 Nova"></div>

    <div id="pantallaVerificando" style="display:none;text-align:center;padding:20px 0">
      <p>Verificando tu acceso…</p>
    </div>

    <form id="loginForm">
      <div class="field" style="margin-bottom:14px">
        <label for="user">Email</label>
        <input type="email" id="user" placeholder="nombre@century21nova.com" autocomplete="username" required>
      </div>

      <button type="submit" class="btn primary" id="btnEnviar" style="width:100%;margin-top:10px;padding:12px">Enviarme el acceso</button>
      <div class="api-error" id="loginError"></div>
      <div class="api-ok" id="loginOk"></div>
    </form>

    <p class="demo-note">
      Sin contraseña: te mandamos un link de acceso de un solo uso a tu email, válido por 15 minutos.
      El panel que ves (Broker, Administración o Asesor/a) depende del rol de tu cuenta — lo asigna
      quien administra los accesos.
    </p>
  </div>
  <p class="login-foot" style="position:relative;z-index:2">© Century 21 Nova — Plataforma de gestión interna</p>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/api.js"></script>
<script>
  // Si ya había sesión real de una visita anterior, entra directo a su panel.
  function destinoPorRol(rol) {
    if (rol === 'asesor') return 'asesor/panel.html';
    if (rol === 'gerente' || rol === 'administracion') return 'admin/finanzas.html';
    return 'admin/dashboard.html';
  }

  async function verificarAcceso(token) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('pantallaVerificando').style.display = '';
    try {
      var body = await C21Api.api('/api/auth/verificar-acceso', { method: 'POST', body: JSON.stringify({ token: token }) });
      window.history.replaceState({}, '', window.location.pathname);
      // api() no guarda sesión sola — la seteamos igual que hacía C21Api.login().
      sessionStorage.setItem('c21-api-token', body.token);
      sessionStorage.setItem('c21-api-usuario', JSON.stringify(body.usuario));
      window.location.href = destinoPorRol(body.usuario.rol);
    } catch (ex) {
      document.getElementById('pantallaVerificando').style.display = 'none';
      document.getElementById('loginForm').style.display = '';
      var err = document.getElementById('loginError');
      err.textContent = ex.message;
      err.style.display = '';
    }
  }

  (function () {
    var u = C21Api.getUsuario();
    if (C21Api.getToken() && u) {
      window.location.href = destinoPorRol(u.rol);
      return;
    }
    var params = new URLSearchParams(window.location.search);
    var token = params.get('acceso');
    if (token) verificarAcceso(token);
  })();

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var err = document.getElementById('loginError'); err.style.display = 'none';
    var ok = document.getElementById('loginOk'); ok.style.display = 'none';
    var btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      await C21Api.api('/api/auth/solicitar-acceso', { method: 'POST', body: JSON.stringify({ email: document.getElementById('user').value }) });
      ok.textContent = 'Si el email está dado de alta, te llegó un link de acceso. Revisá tu correo (y spam).';
      ok.style.display = '';
      e.target.reset();
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = '';
    } finally {
      btn.disabled = false; btn.textContent = 'Enviarme el acceso';
    }
  });
</script>
</body>
</html>
