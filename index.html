<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Century 21 Nova · Plataforma de Gestión</title>
<meta name="description" content="Acceso a la plataforma de gestión de Century 21 Nova">
<script>(function(){try{var t=localStorage.getItem('c21-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .login-screen::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(900px 540px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 540px at 100% 10%, var(--bg-glow-2), transparent 60%);
  }
  .login-foot{text-align:center;margin-top:18px;font-size:.76rem;color:var(--text-3)}
  .demo-note{
    margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);font-size:.74rem;color:var(--text-3);line-height:1.5;
  }
  .asesor-select{display:none}
  .asesor-select.show{display:flex}
</style>
</head>
<body>

<div class="top-fixed-toggle">
  <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="login-screen">
  <div class="login-card">
    <div class="login-banner"><img src="assets/img/nova_fondo.png" alt="Century 21 Nova"></div>

    <div class="role-switch" role="tablist" aria-label="Tipo de acceso">
      <button type="button" class="active" data-role="admin">Administración</button>
      <button type="button" data-role="asesor">Asesor/a</button>
    </div>

    <form id="loginForm">
      <div class="field" style="margin-bottom:14px">
        <label for="user">Usuario</label>
        <input type="text" id="user" placeholder="nombre@century21nova.com" autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:10px">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="field asesor-select" id="asesorSelectWrap" style="margin-bottom:10px">
        <label for="asesorSelect">Ver como (demo)</label>
        <select id="asesorSelect"></select>
      </div>

      <button type="submit" class="btn primary" style="width:100%;margin-top:10px;padding:12px">Ingresar</button>
    </form>

    <p class="demo-note">
      Prototipo de diseño — el acceso todavía no está conectado a la base de datos real.
      Cualquier usuario y contraseña te deja entrar para revisar el panel correspondiente.
    </p>
  </div>
  <p class="login-foot" style="position:relative;z-index:2">© Century 21 Nova — Plataforma de gestión interna</p>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/real-data.js"></script>
<script>
  var role = 'admin';
  var roleBtns = document.querySelectorAll('.role-switch button');
  var asesorWrap = document.getElementById('asesorSelectWrap');
  var asesorSelect = document.getElementById('asesorSelect');

  C21.asesores.forEach(function (a) {
    var opt = document.createElement('option');
    opt.value = a.id; opt.textContent = a.nombre;
    asesorSelect.appendChild(opt);
  });

  roleBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      roleBtns.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      role = b.getAttribute('data-role');
      asesorWrap.classList.toggle('show', role === 'asesor');
    });
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    try {
      sessionStorage.setItem('c21-rol', role);
      if (role === 'asesor') sessionStorage.setItem('c21-asesor', asesorSelect.value);
    } catch (err) {}
    window.location.href = role === 'admin' ? 'admin/dashboard.html' : 'asesor/panel.html';
  });
</script>
</body>
</html>
