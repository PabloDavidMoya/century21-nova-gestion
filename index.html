<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Century 21 Nova · Plataforma de Gestión</title>
<meta name="description" content="Acceso a la plataforma de gestión de Century 21 Nova">
<script>(function(){try{var t=localStorage.getItem('c21-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .login-screen::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(900px 540px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 540px at 100% 10%, var(--bg-glow-2), transparent 60%);
  }
  .login-foot{text-align:center;margin-top:18px;font-size:.76rem;color:var(--text-3)}
  .demo-note{
    margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);font-size:.74rem;color:var(--text-3);line-height:1.5;
  }
  .api-error{color:var(--danger);font-size:.82rem;margin-top:10px;display:none}
  .pass-wrap{position:relative}
  .pass-wrap input{padding-right:40px}
  .pass-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--text-3);
    padding:6px;display:flex;align-items:center;justify-content:center;
  }
  .pass-toggle:hover{color:var(--text)}
  .pass-toggle svg{width:18px;height:18px}
  .pass-toggle .icon-eye-off{display:none}
</style>
</head>
<body>

<div class="top-fixed-toggle">
  <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="login-screen">
  <div class="login-card">
    <div class="login-banner"><img src="assets/img/nova_fondo.png" alt="Century 21 Nova"></div>

    <form id="loginForm">
      <div class="field" style="margin-bottom:14px">
        <label for="user">Email</label>
        <input type="email" id="user" placeholder="nombre@century21nova.com" autocomplete="username" required>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label for="pass">Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="pass-toggle" id="passToggle" aria-label="Mostrar contraseña">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn primary" style="width:100%;margin-top:10px;padding:12px">Ingresar</button>
      <div class="api-error" id="loginError"></div>
    </form>

    <p class="demo-note">
      Accedé con tu usuario y contraseña. El panel que ves (Broker, Administración o Asesor/a)
      depende del rol de tu cuenta — lo asigna quien administra los accesos.
    </p>
  </div>
  <p class="login-foot" style="position:relative;z-index:2">© Century 21 Nova — Plataforma de gestión interna</p>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/api.js"></script>
<script>
  // Si ya había sesión real de una visita anterior, entra directo a su panel.
  function destinoPorRol(rol) {
    if (rol === 'asesor') return 'asesor/panel.html';
    if (rol === 'gerente' || rol === 'administracion') return 'admin/finanzas.html';
    return 'admin/dashboard.html';
  }

  (function () {
    var u = C21Api.getUsuario();
    if (C21Api.getToken() && u) {
      window.location.href = destinoPorRol(u.rol);
    }
  })();

  document.getElementById('passToggle').addEventListener('click', function () {
    var pass = document.getElementById('pass');
    var mostrar = pass.type === 'password';
    pass.type = mostrar ? 'text' : 'password';
    this.classList.toggle('showing', mostrar);
    this.querySelector('.icon-eye').style.display = mostrar ? 'none' : 'inline-flex';
    this.querySelector('.icon-eye-off').style.display = mostrar ? 'inline-flex' : 'none';
    this.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var err = document.getElementById('loginError');
    err.style.display = 'none';
    try {
      var usuario = await C21Api.login(document.getElementById('user').value, document.getElementById('pass').value);
      window.location.href = destinoPorRol(usuario.rol);
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = '';
    }
  });
</script>
</body>
</html>
